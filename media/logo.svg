<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Subtle Circuit / Tech Grid Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 12" stroke-opacity="0.3"/>

  <!-- The Security Shield Core -->
  <path d="M 256,92 
           C 340,92 376,128 376,180
           C 376,280 296,368 256,408
           C 216,368 136,280 136,180
           C 136,128 172,92 256,92 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldBorder)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Antigravity / Rotation Orbital Rings -->
  <ellipse cx="256" cy="245" rx="125" ry="42" fill="none" stroke="url(#orbitGlow)" stroke-width="5" stroke-linecap="round" transform="rotate(-28 256 245)" filter="url(#outerGlow)" opacity="0.9"/>
  <ellipse cx="256" cy="245" rx="125" ry="42" fill="none" stroke="url(#orbitGlow)" stroke-width="5" stroke-linecap="round" transform="rotate(32 256 245)" filter="url(#outerGlow)" opacity="0.75"/>

  <!-- 3 Orbital Rotation Nodes (Representing 3 Account Slots) -->
  <!-- Node 1: Top Right (Cyan - Slot 1 Active) -->
  <circle cx="348" cy="195" r="11" fill="#38bdf8" filter="url(#outerGlow)"/>
  <circle cx="348" cy="195" r="5" fill="#ffffff"/>

  <!-- Node 2: Bottom Center/Right (Emerald - Slot 2) -->
  <circle cx="290" cy="305" r="9" fill="#10b981" filter="url(#outerGlow)"/>
  <circle cx="290" cy="305" r="4" fill="#ffffff"/>

  <!-- Node 3: Mid Left (Indigo/Purple - Slot 3) -->
  <circle cx="152" cy="275" r="8" fill="#818cf8" filter="url(#outerGlow)"/>
  <circle cx="152" cy="275" r="3.5" fill="#ffffff"/>

  <!-- Center Quantum Core Glyph (Inverted Delta / Antigravity Levitation Symbol) -->
  <g transform="translate(256, 238) scale(1.1)">
    <!-- Levitation Upward Chevron -->
    <path d="M 0,-40 L 26,0 L 13,0 L 0,-20 L -13,0 L -26,0 Z" fill="url(#coreGlow)" filter="url(#outerGlow)"/>
    <!-- Central Power Spark -->
    <polygon points="0,-12 18,22 0,12 -18,22" fill="#38bdf8"/>
    <circle cx="0" cy="3" r="4" fill="#ffffff"/>
  </g>

  <!-- High-Tech Accent Crosshairs -->
  <line x1="256" y1="120" x2="256" y2="134" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="374" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="180" x2="186" y2="180" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="326" y1="180" x2="340" y2="180" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
</svg>
